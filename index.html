<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef5ff">
  <title>クラゲにほめられる</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: linear-gradient(#eef6ff, #f8fbff);
      color: #17233b;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    main {
      width: min(520px, 100%);
      text-align: center;
    }
    .character {
      width: min(260px, 70vw);
      max-height: 280px;
      object-fit: contain;
      margin: 0 auto 8px;
      display: block;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    .bubble {
      position: relative;
      background: white;
      border: 3px solid #17233b;
      border-radius: 24px;
      padding: 20px 18px;
      min-height: 105px;
      display: grid;
      place-items: center;
      font-size: clamp(22px, 6vw, 30px);
      font-weight: 800;
      line-height: 1.45;
      box-shadow: 0 10px 25px rgba(25, 48, 90, .12);
      margin-bottom: 18px;
    }
    .bubble::before {
      content: "";
      position: absolute;
      top: -17px;
      left: 50%;
      width: 26px;
      height: 26px;
      background: white;
      border-left: 3px solid #17233b;
      border-top: 3px solid #17233b;
      transform: translateX(-50%) rotate(45deg);
    }
    .buttons {
      display: grid;
      gap: 12px;
    }
    button {
      border: 0;
      border-radius: 20px;
      padding: 19px 16px;
      font-size: 21px;
      font-weight: 800;
      color: white;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 8px 18px rgba(0,0,0,.10);
    }
    button:active { transform: scale(.98); }
    #studyBtn { background: #1658e8; }
    #restBtn { background: #7186ad; }
    #count {
      margin-top: 14px;
      font-size: 13px;
      color: #60708e;
    }
  </style>
</head>
<body>
  <main>
    <img class="character" src="character.png" alt="青いクラゲのキャラクター">

    <div class="bubble" id="message" aria-live="polite">
      勉強したら教えてね
    </div>

    <div class="buttons">
      <button id="studyBtn">勉強した！</button>
      <button id="restBtn">休憩する</button>
    </div>

    <div id="count">今日の「勉強した！」：0回</div>
  </main>

  <script>
    const studyMessages = [
      "えらい！！！勉強したのすごい！",
      "すごい！！ちゃんと勉強した！",
      "えらすぎる！！よくやった！",
      "勉強したの！？すごい！！",
      "ちゃんとやった！えらい！！",
      "すごいすごい！！今日も進んだ！",
      "えらい！！勉強した時点でもうすごい！",
      "やったじゃん！！本当にえらい！",
      "勉強した！すごい！！",
      "よくできました！！えらい！"
    ];

    const restMessages = [
      "うん、休んでね。",
      "ゆっくり休んでね。",
      "休憩してきてね。",
      "ちゃんと休んでおいで。",
      "いってらっしゃい。ゆっくりしてきてね。",
      "うん、今は休憩。",
      "のんびり休んでね。"
    ];

    const message = document.getElementById("message");
    const count = document.getElementById("count");
    const studyBtn = document.getElementById("studyBtn");
    const restBtn = document.getElementById("restBtn");

    const todayKey = () => {
      const d = new Date();
      return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    };

    function randomOf(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function loadCount() {
      const savedDate = localStorage.getItem("jelly_date");
      if (savedDate !== todayKey()) {
        localStorage.setItem("jelly_date", todayKey());
        localStorage.setItem("jelly_count", "0");
      }
      return Number(localStorage.getItem("jelly_count") || 0);
    }

    function showCount(n) {
      count.textContent = `今日の「勉強した！」：${n}回`;
    }

    let n = loadCount();
    showCount(n);

    studyBtn.addEventListener("click", () => {
      message.textContent = randomOf(studyMessages);
      n++;
      localStorage.setItem("jelly_date", todayKey());
      localStorage.setItem("jelly_count", String(n));
      showCount(n);
    });

    restBtn.addEventListener("click", () => {
      message.textContent = randomOf(restMessages);
    });
  </script>
</body>
</html>
